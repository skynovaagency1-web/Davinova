<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Davinova">
<style>
.d{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.4s cubic-bezier(.65,0,.35,1) .1s forwards}
.s{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-90deg);animation:in .7s cubic-bezier(.34,1.56,.64,1) 1.1s forwards,tw 3.2s ease-in-out 2s infinite}
.w{font:900 38px Archivo,'Arial Black',sans-serif;letter-spacing:2px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes in{to{transform:scale(1) rotate(0)}}
@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.82) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){.d,.s{animation:none;stroke-dashoffset:0;transform:none}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5b3fd1"/><stop offset=".4" stop-color="#9b5cf0"/><stop offset=".75" stop-color="#e86fc0"/><stop offset="1" stop-color="#ff9a8b"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 32 32;360 32 32" dur="9s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#141018"/><stop offset=".45" stop-color="#141018"/><stop offset=".5" stop-color="#e86fc0"/><stop offset=".55" stop-color="#141018"/><stop offset="1" stop-color="#141018"/><animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/></linearGradient></defs>
<g transform="translate(8 8)"><path class="d" pathLength="100" d="M17 9 V55 H29 C45.5 55 55 45 55 32 C55 19 45.5 9 29 9 Z" fill="none" stroke="url(#g)" stroke-width="5.5" stroke-linejoin="round"/><path class="s" d="M33 19 C34 27.5 36.5 30.5 45 32 C36.5 33.5 34 36.5 33 45 C32 36.5 29.5 33.5 21 32 C29.5 30.5 32 27.5 33 19 Z" fill="url(#g)"/></g>
<text class="w" x="84" y="54" fill="url(#t)">DAVINOVA</text>
