<head>

<meta name="robots" content="noindex">

<style>
  :root { color-scheme: dark; }

  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center; align-content: center; gap: 16px;
    padding: 24px calc(24px + env(safe-area-inset-right, 0px))

  }
  .mark { width: 60px; height: 60px; border-radius: 16px; object-fit: cover; }
  h1 { margin: 4px 0 0; font-size: 23px; line-height: 1.25; letter-spacing: .4px; font-weight: 600; }
  p { margin: 0; max-width: 34ch; color: rgba(251, 241, 226, .7); }
  a {
    display: inline-block; margin-top: 10px; padding: 13px 28px; border-radius: 999px;
    background: linear-gradient(135deg, #e9d6bc, #b08a63); color: #2e2019;
    font-weight: 700; font-size: 15px; text-decoration: none;
    -webkit-tap-highlight-color: transparent; transition: transform .15s ease, opacity .15s ease;
  }
  a:active { transform: translateY(1px); opacity: .92; }
  small { color: rgba(251, 241, 226, .45); font-size: 13px; }
</style>
</head>
<body>
  <img class="mark" src="/icon-192.png" alt="Davinova" width="60" height="60">

</body>
