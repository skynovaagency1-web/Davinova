name: Check products against CJ

on:
  # Editing scripts/cj-check.json on this branch starts a run (manual runs need this file on the default branch).
  push:
    branches-ignore: [main]
    paths: [scripts/cj-check.json]
  workflow_dispatch:
    inputs:
      limit:
        description: Only check this many products (0 = all)
        default: '0'

permissions:
  contents: write

concurrency: cj-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: request
        run: echo "json=$(jq -c . scripts/cj-check.json)" >> "$GITHUB_OUTPUT"
      - name: Check every shown product
        run: node --experimental-strip-types scripts/cj-check.ts
        env:
          ADMIN_PASSWORD: ${{ secrets.DAVINOVA_ADMIN_PASSWORD }}
          LIMIT: ${{ inputs.limit || fromJSON(steps.request.outputs.json).limit }}
          RETRY: ${{ fromJSON(steps.request.outputs.json).retry || '' }}
          UNPRICED: ${{ fromJSON(steps.request.outputs.json).unpriced || '' }}
          OUT: ${{ fromJSON(steps.request.outputs.json).out || '' }}
      - name: Commit report
        run: |
          git config user.name "davinova-bot"
          git config user.email "davinova-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "CJ product check report"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
