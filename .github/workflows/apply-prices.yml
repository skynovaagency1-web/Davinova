name: Apply approved prices

on:
  # Editing scripts/price-apply.json on this branch starts a run.
  push:
    branches: [feature/3d-fashion-storefront]
    paths: [scripts/price-apply.json]
  workflow_dispatch:

concurrency: apply-prices

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send prices to the store database
        run: node --experimental-strip-types scripts/apply-prices.ts
        env:
          ADMIN_PASSWORD: ${{ secrets.DAVINOVA_ADMIN_PASSWORD }}
