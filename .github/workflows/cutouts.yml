name: Product cutouts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Products to check in this run
        default: '300'
  push:
    branches: [feature/3d-fashion-storefront]
    paths: [scripts/cutouts.py, scripts/models/**, .github/workflows/cutouts.yml]

permissions:
  contents: write

concurrency: cutouts

jobs:
  cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "rembg[cpu]==2.0.85" pillow opencv-python-headless
      - run: python scripts/cutouts.py
        env:
          LIMIT: ${{ github.event.inputs.limit || '300' }}
      - name: Commit cutouts
        run: |
          git config user.name "davinova-bot"
          git config user.email "davinova-bot@users.noreply.github.com"
          git add public/cutouts public/images
          git diff --cached --quiet && exit 0
          git commit -m "Add background-free product cutouts"
          # Other runs may have pushed cutouts meanwhile; on overlapping lines keep this run's newer results.
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          python scripts/cutouts_sync.py
          git diff --quiet || git commit -am "Keep cutouts hidden or recut by hand"
          git push origin HEAD:${{ github.ref_name }}
