name: Test design maker background remover
on:
  push:
    branches: [claude/project-thread-3n9hsq-bgtest]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/bg-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bg-test, path: bg-*.png }
