name: Fill categories from CJ

on:
  # Manual runs need this file on the default branch; on this branch, editing scripts/cj-fill.json starts a run.
  push:
    branches: [feature/3d-fashion-storefront]
    paths: [scripts/cj-fill.json]
  workflow_dispatch:
    inputs:
      target:
        description: Products wanted in each sub-category
        default: '6'
      max_imports:
        description: Most products to import in this run
        default: '120'
      only:
        description: Only these sub-category slugs (comma-separated, optional)
        default: ''

permissions:
  contents: write

concurrency: cutouts

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: request
        run: echo "json=$(jq -c . scripts/cj-fill.json)" >> "$GITHUB_OUTPUT"
      - name: Import from CJ
        run: node --experimental-strip-types scripts/cj-fill.ts
        env:
          ADMIN_PASSWORD: ${{ secrets.DAVINOVA_ADMIN_PASSWORD }}
          TARGET: ${{ inputs.target || fromJSON(steps.request.outputs.json).target }}
          MAX_IMPORTS: ${{ inputs.max_imports || fromJSON(steps.request.outputs.json).max_imports }}
          ONLY: ${{ inputs.only || fromJSON(steps.request.outputs.json).only }}
          PLUS: ${{ fromJSON(steps.request.outputs.json).plus || '' }}
          MEN: ${{ fromJSON(steps.request.outputs.json).men || '' }}
          JEWELRY: ${{ fromJSON(steps.request.outputs.json).jewelry || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "rembg[cpu]==2.0.85" pillow opencv-python-headless
      - name: Check photos of the new products
        # Start from the latest cutouts so only the new products are checked.
        run: git pull --ff-only origin ${{ github.ref_name }} && sleep 30 && python scripts/cutouts.py
      - name: Commit cutouts
        run: |
          git config user.name "davinova-bot"
          git config user.email "davinova-bot@users.noreply.github.com"
          git add public/cutouts
          git diff --cached --quiet && exit 0
          git commit -m "Check photos of newly imported products"
          # Other runs may have pushed cutouts meanwhile; on overlapping lines keep this run's newer results.
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
