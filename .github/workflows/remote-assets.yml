name: Remote assets

# Downloads generated images listed in scripts/remote-assets.json into the repo
# (the build container cannot reach every image host; GitHub's runners can).
on:
  workflow_dispatch:
  push:
    branches: [feature/3d-fashion-storefront]
    paths: [scripts/remote-assets.json, .github/workflows/remote-assets.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          jq -c '.[]' scripts/remote-assets.json | while read -r item; do
            url=$(echo "$item" | jq -r .url); path=$(echo "$item" | jq -r .path)
            [ -f "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            curl -fsSL "$url" -o "$path"
          done
      - name: Commit
        run: |
          git config user.name "davinova-bot"
          git config user.email "davinova-bot@users.noreply.github.com"
          git add public
          git diff --cached --quiet && exit 0
          git commit -m "Add downloaded image assets"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
