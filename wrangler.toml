name = "davinova-store"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "davinova-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

# Uncomment after creating an R2 bucket and implementing upload handling.
# [[r2_buckets]]
# binding = "PRODUCT_MEDIA"
# bucket_name = "davinova-product-media"

[vars]
STORE_NAME = "Davinova"
CURRENCY = "USD"
DRY_RUN = "true"
PAYPAL_ENV = "sandbox"

[triggers]
# Enable after scheduled tracking sync is implemented and tested.
crons = ["15 * * * *"] # Hourly CJ tracking sync; no-ops while DRY_RUN=true.
