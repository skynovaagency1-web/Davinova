        var loaded=false;
        w.__dvLoadAnalytics=function(){
          if(loaded)return; loaded=true;
          gtag('js', new Date()); gtag('config', 'G-04MW49TTYM');
          w.dataLayer.push({'gtm.start':new Date().getTime(),event:'gtm.js'});
          ['https://www.googletagmanager.com/gtm.js?id=GTM-THBDWSJM','https://www.googletagmanager.com/gtag/js?id=G-04MW49TTYM'].forEach(function(src){
            var j=d.createElement('script'); j.async=true; j.src=src; d.head.appendChild(j);
          });
        };
        var choice=null; try{choice=localStorage.getItem('davinova-consent');}catch(e){}
        if(choice==='granted' || (!w.__dvNeedsConsent && choice!=='denied')) w.__dvLoadAnalytics();
      })(window,document);
    </script>
